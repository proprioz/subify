version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # pnpm updates wait 7 days, like minimumReleaseAge. Minor and patch updates come as one pull
  # request; each major update gets its own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pnpm:
        update-types:
          - "minor"
          - "patch"
