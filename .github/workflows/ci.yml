name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on main always finish, one after
# the other, so two deploys never overlap and they land in the order of the commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests on Node and Workers
        run: pnpm test:all

      - name: Build the PWA and the server bundles
        run: |
          pnpm --filter @subify/web build
          pnpm --filter @subify/server build

  # Checks the locked pnpm packages against published security advisories. audit.yml runs the
  # same check every week, for advisories published after the last change to the lockfile.
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit pnpm packages
        run: pnpm audit

  # Deploys the instance from main, only once every check above has passed. A repository without
  # the CLOUDFLARE_ACCOUNT_ID and INSTANCE_URL variables (a fork, for instance) skips it. Pull
  # requests never reach it, so their code never runs with the Cloudflare token.
  deploy:
    needs: [checks, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.INSTANCE_URL != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the PWA
        run: pnpm --filter @subify/web build

      # wrangler.toml holds no instance's values: the deploy uses wrangler.deploy.toml, written from
      # the repository's variables (scripts/deploy-config.ts).
      - name: Write the instance's configuration
        run: pnpm --filter @subify/server deploy:config
        env:
          INSTANCE_URL: ${{ vars.INSTANCE_URL }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          INSTANCE_NAME: ${{ vars.INSTANCE_NAME }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_CONTACT: ${{ vars.OPERATOR_CONTACT }}
          SEEDED_CHANNELS_PER_DAY: ${{ vars.SEEDED_CHANNELS_PER_DAY }}
          SEARCH_SOURCES: ${{ vars.SEARCH_SOURCES }}
          # A secret, not a variable: deploy logs are public on a public repository, and GitHub hides secrets in them.
          MESSAGES_TO: ${{ secrets.MESSAGES_TO }}
          MESSAGES_FROM: ${{ vars.MESSAGES_FROM }}

      # Before the new code, which may need them. Migrations only add to the schema, so the code
      # still running until the deploy below keeps working. D1 takes a backup before applying.
      - name: Apply the database migrations
        run: pnpm --filter @subify/server exec wrangler d1 migrations apply subify --remote --config wrangler.deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker and the PWA
        # The commit goes with the deploy, so /api/health tells which code the instance runs.
        run: pnpm --filter @subify/server exec wrangler deploy --config wrangler.deploy.toml --var COMMIT:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that leaves the API unreachable, or still serving the previous commit, fails the run.
      - name: Check the deployed API
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error "$INSTANCE_URL/api/health" | grep -q "\"commit\":\"$GITHUB_SHA\"" && exit 0
            sleep 10
          done
          exit 1
        env:
          INSTANCE_URL: ${{ vars.INSTANCE_URL }}
