# Development with Docker: the Node server with hot reload and Vite, sources mounted from the
# host. Without Docker, `pnpm dev` does the same. Open http://localhost:5173.
services:
  server:
    image: node:24-bookworm-slim
    working_dir: /app/apps/server
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    environment:
      PORT: "8787"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    env_file:
      - path: apps/server/.env
        required: false
    volumes:
      - .:/app
      # Linux builds of the dependencies, kept apart from the host's node_modules.
      - node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - data:/data

  web:
    image: node:24-bookworm-slim
    working_dir: /app/apps/web
    # Waits for the server container's install, which fills the shared node_modules volumes.
    command: sh -c "corepack enable && until [ -e /app/node_modules/.modules.yaml ]; do sleep 2; done && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://server:8787
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

volumes:
  node_modules:
  server_node_modules:
  web_node_modules:
  shared_node_modules:
  data:
