<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The installed app draws under iOS's status bar, so the refresh bar can fill it (theme.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Subify</title>
    <!-- The server answers these for the host it serves: the name its admin gave it, and the icon in red on subify.tv, in blue elsewhere (apps/server/src/instance.ts). -->
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="icon" href="/api/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="/api/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/api/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
